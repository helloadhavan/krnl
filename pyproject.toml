[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krnl"
version = "0.2.1"
description = "A lightweight educational tensor and automatic differentiation library with CPU and OpenCL GPU support"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Adhavan", email = "helloadhavan@gmaim.com" },
]

dependencies = [
    "attrs==26.1.0",
    "Automat==25.4.16",
    "constantly==23.10.4",
    "construct==2.10.70",
    "hyperlink==21.0.0",
    "idna==3.20",
    "Incremental==24.11.0",
    "Mako==1.4.3",
    "MarkupSafe==3.0.4",
    "numpy==2.5.4",
    "packaging==26.3",
    "platformdirs==4.13.5",
    "protobuf==7.36.2",
    "psutil==7.2.2",
    "pyasn1==0.6.4",
    "pyopencl==2026.1.4",
    "pysnmp==7.1.30",
    "pytools==2026.1.1",
    "PyYAML==6.0.3",
    "siphash24==1.9",
    "Twisted==26.4.0",
    "typing_extensions==4.16.0",
    "zope.interface==8.7",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["krnl", "krnl.backends", "krnl.nn"]
